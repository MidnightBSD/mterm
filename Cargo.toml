[package]
name = "mterm"
version = "0.1.1"
edition = "2024"
license = "BSD-2-Clause"
repository = "https://github.com/MidnightBSD/mterm"
description = "Midnight Terminal: a GTK4 terminal emulator in Rust with OSC 52 remote copy/paste, profiles, and Unicode support"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_10"] }
pangocairo = "0.20"
unicode-width = "0.2"
base64 = "0.22"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]

[profile.dev]
opt-level = 1
